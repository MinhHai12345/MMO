spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ${SPRING_APPLICATION_NAME:mmo}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/football_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: ${JPA_OPEN_IN_VIEW:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: ${HIBERNATE_FORMAT_SQL:true}

  quartz:
    job-store-type: ${QUARTZ_JOB_STORE_TYPE:jdbc}
    jdbc:
      initialize-schema: ${QUARTZ_INITIALIZE_SCHEMA:never}
    properties:
      org:
        quartz:
          jobStore:
            driverDelegateClass: ${QUARTZ_DRIVER_DELEGATE_CLASS:org.quartz.impl.jdbcjobstore.StdJDBCDelegate}

  servlet:
    multipart:
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}

server:
  port: ${SERVER_PORT:8188}

app:
  initial-data:
    auto-import: ${APP_INITIAL_DATA_AUTO_IMPORT:true}

  telegram:
    bot:
      token: ${TELEGRAM_TOKEN:mock}
      username: ${TELEGRAM_BOT_USERNAME:H2_FB_Bot}
    channel:
      id: ${TELEGRAM_CHANNEL_ID:mock}
      free: ${FREE_CHANNEL_ID:mock}
      premium: ${PREMIUM_CHANNEL_ID:mock}

  twitter:
    consumer:
      key: ${TWITTER_CONSUMER_KEY:mock}
      secret: ${TWITTER_CONSUMER_SECRET:mock}
    access:
      token: ${TWITTER_ACCESS_TOKEN:mock}
      secret: ${TWITTER_ACCESS_SECRET:mock}

  facebook:
    page:
      id: ${FACEBOOK_PAGE_ID:mock}
    access:
      token: ${FACEBOOK_ACCESS_TOKEN:mock}

  stripe:
    api:
      key: ${STRIPE_API_KEY:mock}
      webhook:
        secret: ${STRIPE_WEBHOOK_SECRET:mock}

  sofa-score:
    api: ${SOFASCORE_API_URL:https://api.sofascore.com/api/v1/}
    url: ${SOFASCORE_WEB_URL:https://www.sofascore.com}

  ingestion:
    providers:
      # Values must match com.mmo.module.fb.domain.enums.Provider.
      league: ${INGESTION_LEAGUE_PROVIDER:API_FOOTBALL}
      team: ${INGESTION_TEAM_PROVIDER:API_FOOTBALL}
      fixture: ${INGESTION_FIXTURE_PROVIDER:API_FOOTBALL}
      standings: ${INGESTION_STANDINGS_PROVIDER:API_FOOTBALL}
      odds: ${INGESTION_ODDS_PROVIDER:API_FOOTBALL}

  api-football:
    enabled: ${API_FOOTBALL_ENABLED:true}
    base-url: ${API_FOOTBALL_BASE_URL:https://v3.football.api-sports.io}
    api-key: ${API_FOOTBALL_API_KEY:mock}
    # Comma-separated league IDs; empty means no explicit league filter.
    league-ids: ${API_FOOTBALL_LEAGUE_IDS:}
    # Comma-separated season start years; empty uses current year.
    seasons: ${API_FOOTBALL_SEASONS:}

  understats:
    base-url: ${UNDERSTAT_BASE_URL:https://understat.com}
