spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  application:
    name: mmo

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:50}
        order_inserts: true
        order_updates: true

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    wait-for-jobs-to-complete-on-shutdown: true
    overwrite-existing-jobs: false
    properties:
      org:
        quartz:
          scheduler:
            instanceName: MMOQuartzScheduler
            instanceId: AUTO
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            isClustered: ${QUARTZ_CLUSTERED:true}
            clusterCheckinInterval: ${QUARTZ_CLUSTER_CHECKIN_INTERVAL:15000}
            misfireThreshold: ${QUARTZ_MISFIRE_THRESHOLD:60000}

  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB

server:
  port: 8188

# Framework settings stay under spring.* / server.*.
# Application settings are bound by com.mmo.AppProperties.
app:
  content:
    publishing:
      api-key: ${CONTENT_PUBLISHING_API_KEY}

  initial-data:
    auto-import: ${APP_INITIAL_DATA_AUTO_IMPORT:true}

  # Credentials and destination identifiers for outbound social publishing.
  social:
    telegram:
      bot:
        token: ${TELEGRAM_TOKEN}
        username: ${TELEGRAM_BOT_USERNAME}
      channel:
        id: ${TELEGRAM_CHANNEL_ID}
        free: ${FREE_CHANNEL_ID}
        premium: ${PREMIUM_CHANNEL_ID}

    twitter:
      consumer:
        key: ${TWITTER_CONSUMER_KEY}
        secret: ${TWITTER_CONSUMER_SECRET}
      access:
        token: ${TWITTER_ACCESS_TOKEN}
        secret: ${TWITTER_ACCESS_SECRET}

    facebook:
      page:
        id: ${FACEBOOK_PAGE_ID}
      access:
        token: ${FACEBOOK_ACCESS_TOKEN}

  stripe:
    api:
      key: ${STRIPE_API_KEY}
      webhook:
        secret: ${STRIPE_WEBHOOK_SECRET}

  monetization:
    events:
      api-key: ${FB_MONETIZATION_EVENTS_API_KEY:}

  publication:
    worker:
      batch-size: ${FB_PUBLICATION_BATCH_SIZE:10}
      max-attempts: ${FB_PUBLICATION_MAX_ATTEMPTS:5}
      retry-delay-millis: ${FB_PUBLICATION_RETRY_DELAY_MILLIS:300000}

  # Ingestion owns all football-data provider configuration and provider routing.
  ingestion:
    operations:
      # Required to enable the protected full-rebuild API. Leave empty to disable it.
      api-key: ${INGESTION_ADMIN_API_KEY:mock}
    providers:
      league: ${INGESTION_LEAGUE_PROVIDER:FOOTBALL_DATA}
      season: ${INGESTION_SEASON_PROVIDER:${INGESTION_LEAGUE_PROVIDER:FOOTBALL_DATA}}
      team: ${INGESTION_TEAM_PROVIDER:FOOTBALL_DATA}
      fixture: ${INGESTION_FIXTURE_PROVIDER:FOOTBALL_DATA}
      standings: ${INGESTION_STANDINGS_PROVIDER:FOOTBALL_DATA}
      # Upcoming odds and third-party historical statistics are disabled in Phase 1.

    provider-config:
      FOOTBALL_DATA:
        enabled: ${FOOTBALL_DATA_ENABLED:true}
        uri: ${FOOTBALL_DATA_URI:https://api.football-data.org/v4}
        api-key: ${FOOTBALL_DATA_API_KEY:}

      API_FOOTBALL:
        enabled: ${API_FOOTBALL_ENABLED:false}
        uri: ${API_FOOTBALL_URI:}
        api-key: ${API_FOOTBALL_API_KEY:}

      SOFA_SCORE:
        enabled: ${SOFA_SCORE_ENABLED:false}
        uri: ${SOFA_SCORE_URI:}
        web-url: ${SOFA_SCORE_WEB_URL:}
        options:
          tournament-region: ${SOFA_SCORE_TOURNAMENT_REGION:EN}
          headless: ${SOFA_SCORE_HEADLESS:true}
          manual-captcha-intervention: ${SOFA_SCORE_MANUAL_CAPTCHA_INTERVENTION:false}
          captcha-wait-timeout-seconds: ${SOFA_SCORE_CAPTCHA_WAIT_TIMEOUT_SECONDS:180}

      UNDER_STATS:
        enabled: ${UNDER_STATS_ENABLED:false}
        uri: ${UNDER_STAT_URI:}
        web-url: ${UNDER_STAT_WEB_URL:}

      FOOTBALL_DATA_UK:
        enabled: ${FOOTBALL_DATA_UK_ENABLED:true}
        uri: ${FOOTBALL_DATA_UK_URI:https://www.football-data.co.uk}

  sync:
    bootstrap-on-start: ${APP_SYNC_BOOTSTRAP_ON_START:false}
    max-event-pages: ${SOFA_SCORE_MAX_EVENT_PAGES:20}
    max-rounds: ${SOFA_SCORE_MAX_ROUNDS:50}

mmo:
  workflow:
    readiness:
      minimum-score-coverage: ${MMO_WORKFLOW_MIN_SCORE_COVERAGE:0.95}
      minimum-xg-coverage: ${MMO_WORKFLOW_MIN_XG_COVERAGE:0.80}
      minimum-team-statistics-coverage: ${MMO_WORKFLOW_MIN_TEAM_STATS_COVERAGE:0.80}
      maximum-snapshot-age-hours: ${MMO_WORKFLOW_MAX_SNAPSHOT_AGE_HOURS:72}
