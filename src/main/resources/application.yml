spring:
  profiles:
    active: dev
  application:
    name: mmo

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
app:
  initial-data:
    auto-import: true
  telegram:
    bot:
      token: ${TELEGRAM_TOKEN}
      username: H2_FB_Bot
    channel:
      id: ${CHANNEL_ID}
  sofa-score:
    api: https://api.sofascore.com/api/v1/