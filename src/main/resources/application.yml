spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  application:
    name: mmo

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org:
        quartz:
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate

  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB

server:
  port: ${SERVER_PORT}

# Framework settings stay under spring.* / server.*.
# Application settings are bound by com.mmo.AppProperties.
app:
  content:
    publishing:
      api-key: ${CONTENT_PUBLISHING_API_KEY}

  initial-data:
    auto-import: ${APP_INITIAL_DATA_AUTO_IMPORT}

  # Credentials and destination identifiers for outbound social publishing.
  social:
    telegram:
      bot:
        token: ${TELEGRAM_TOKEN}
        username: ${TELEGRAM_BOT_USERNAME}
      channel:
        id: ${TELEGRAM_CHANNEL_ID}
        free: ${FREE_CHANNEL_ID}
        premium: ${PREMIUM_CHANNEL_ID}

    twitter:
      consumer:
        key: ${TWITTER_CONSUMER_KEY}
        secret: ${TWITTER_CONSUMER_SECRET}
      access:
        token: ${TWITTER_ACCESS_TOKEN}
        secret: ${TWITTER_ACCESS_SECRET}

    facebook:
      page:
        id: ${FACEBOOK_PAGE_ID}
      access:
        token: ${FACEBOOK_ACCESS_TOKEN}

  stripe:
    api:
      key: ${STRIPE_API_KEY}
      webhook:
        secret: ${STRIPE_WEBHOOK_SECRET}

  # Ingestion owns all football-data provider configuration and provider routing.
  ingestion:
    providers:
      league: ${INGESTION_LEAGUE_PROVIDER}
      team: ${INGESTION_TEAM_PROVIDER}
      fixture: ${INGESTION_FIXTURE_PROVIDER}
      standings: ${INGESTION_STANDINGS_PROVIDER}
      odds: ${INGESTION_ODDS_PROVIDER}

    sofa-score:
      api: ${SOFA_SCORE_API_URL}
      url: ${SOFA_SCORE_WEB_URL}
      tournament-region: ${SOFASCORE_TOURNAMENT_REGION}

    api-football:
      enabled: ${API_FOOTBALL_ENABLED}
      base-url: ${API_FOOTBALL_BASE_URL}
      api-key: ${API_FOOTBALL_API_KEY}
      league-ids: ${API_FOOTBALL_LEAGUE_IDS}

    football-data:
      enabled: ${FOOTBALL_DATA_ENABLED}
      base-url: ${FOOTBALL_DATA_BASE_URL}
      api-key: ${FOOTBALL_DATA_API_KEY}
      competition-ids: ${FOOTBALL_DATA_COMPETITION_IDS}
      seasons: ${FOOTBALL_DATA_SEASONS}

    understats:
      base-url: ${UNDER_STAT_BASE_URL}

  sync:
    bootstrap-on-start: ${APP_SYNC_BOOTSTRAP_ON_START}
    seasons-per-league: ${APP_SYNC_SEASONS_PER_LEAGUE}
    # Comma-separated SofaScore unique tournament IDs; empty enables provider discovery/default behavior.
    tournament-ids: ${SOFA_SCORE_TOURNAMENT_IDS}
    max-event-pages: ${SOFA_SCORE_MAX_EVENT_PAGES}
    max-rounds: ${SOFA_SCORE_MAX_ROUNDS}
