spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  application:
    name: mmo

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org:
        quartz:
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate

  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB

server:
  port: 8188

# Framework settings stay under spring.* / server.*.
# Application settings are bound by com.mmo.AppProperties.
app:
  content:
    publishing:
      api-key: ${CONTENT_PUBLISHING_API_KEY}

  initial-data:
    auto-import: ${APP_INITIAL_DATA_AUTO_IMPORT}

  # Credentials and destination identifiers for outbound social publishing.
  social:
    telegram:
      bot:
        token: ${TELEGRAM_TOKEN}
        username: ${TELEGRAM_BOT_USERNAME}
      channel:
        id: ${TELEGRAM_CHANNEL_ID}
        free: ${FREE_CHANNEL_ID}
        premium: ${PREMIUM_CHANNEL_ID}

    twitter:
      consumer:
        key: ${TWITTER_CONSUMER_KEY}
        secret: ${TWITTER_CONSUMER_SECRET}
      access:
        token: ${TWITTER_ACCESS_TOKEN}
        secret: ${TWITTER_ACCESS_SECRET}

    facebook:
      page:
        id: ${FACEBOOK_PAGE_ID}
      access:
        token: ${FACEBOOK_ACCESS_TOKEN}

  stripe:
    api:
      key: ${STRIPE_API_KEY}
      webhook:
        secret: ${STRIPE_WEBHOOK_SECRET}

  monetization:
    events:
      api-key: ${FB_MONETIZATION_EVENTS_API_KEY:}

  publication:
    worker:
      batch-size: ${FB_PUBLICATION_BATCH_SIZE:10}
      max-attempts: ${FB_PUBLICATION_MAX_ATTEMPTS:5}
      retry-delay-millis: ${FB_PUBLICATION_RETRY_DELAY_MILLIS:300000}

  # Ingestion owns all football-data provider configuration and provider routing.
  ingestion:
    providers:
      league: ${INGESTION_LEAGUE_PROVIDER:FOOTBALL_DATA}
      team: ${INGESTION_TEAM_PROVIDER:FOOTBALL_DATA}
      fixture: ${INGESTION_FIXTURE_PROVIDER:FOOTBALL_DATA}
      standings: ${INGESTION_STANDINGS_PROVIDER:FOOTBALL_DATA}
      odds: ${INGESTION_ODDS_PROVIDER:API_FOOTBALL}
      historical-stats: ${INGESTION_HISTORICAL_STATS_PROVIDER:UNDER_STATS}

    provider-config:
      FOOTBALL_DATA:
        enabled: ${FOOTBALL_DATA_ENABLED}
        uri: ${FOOTBALL_DATA_URI}
        api-key: ${FOOTBALL_DATA_API_KEY}

      API_FOOTBALL:
        enabled: ${API_FOOTBALL_ENABLED}
        uri: ${API_FOOTBALL_URI}
        api-key: ${API_FOOTBALL_API_KEY}

      SOFA_SCORE:
        enabled: ${SOFA_SCORE_ENABLED}
        uri: ${SOFA_SCORE_URI}
        web-url: ${SOFA_SCORE_WEB_URL}
        options:
          tournament-region: ${SOFA_SCORE_TOURNAMENT_REGION:EN}
          headless: ${SOFA_SCORE_HEADLESS:true}
          manual-captcha-intervention: ${SOFA_SCORE_MANUAL_CAPTCHA_INTERVENTION:false}
          captcha-wait-timeout-seconds: ${SOFA_SCORE_CAPTCHA_WAIT_TIMEOUT_SECONDS:180}

      UNDER_STATS:
        enabled: ${UNDER_STATS_ENABLED}
        uri: ${UNDER_STAT_BASE_URL}
        options:
          # Session cookies are optional and must be supplied outside source control.
          cookie: ${UNDER_STAT_COOKIE:}
          user-agent: ${UNDER_STAT_USER_AGENT:}

  sync:
    bootstrap-on-start: ${APP_SYNC_BOOTSTRAP_ON_START:true}
    max-event-pages: ${SOFA_SCORE_MAX_EVENT_PAGES:20}
    max-rounds: ${SOFA_SCORE_MAX_ROUNDS:50}
